<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Maverick Infra Billing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div style="width:56px;height:56px;background:#1a5276;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;">
        <i class="bi bi-building text-white" style="font-size:1.6rem"></i>
      </div>
      <div class="co-name mt-2">MAVERICK INFRA AND ENGINEERS PVT. LTD.</div>
      <div class="tagline">'Model • Innovate • Elevate'</div>
    </div>

    <h5 class="text-center mb-4" style="color:#1a5276;font-weight:700">Billing System</h5>

    {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
    {% endfor %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person me-1"></i>Username</label>
        <input type="text" name="username" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
        <label class="form-check-label" for="rememberMe" style="font-size:.84rem">Remember me</label>
      </div>
      <button type="submit" class="btn btn-teal w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i> Log In
      </button>
    </form>

    <div class="text-center mt-4" style="font-size:.72rem;color:#aaa">
      Maverick Infra Billing &copy; {{ now.year }}
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
