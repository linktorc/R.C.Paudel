{% extends "base.html" %}
{% block title %}{{ 'Edit' if client else 'Add' }} Client{% endblock %}
{% block page_title %}{{ 'Edit' if client else 'Add' }} Client{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header">
        <i class="bi bi-person-plus me-2"></i>{{ 'Edit' if client else 'New' }} Client
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Company / Client Name *</label>
            <input type="text" name="name" class="form-control"
                   value="{{ client.name if client else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="2">{{ client.address if client else '' }}</textarea>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control"
                     value="{{ client.phone if client else '' }}" placeholder="(977) XXXXX XXXXX">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control"
                     value="{{ client.email if client else '' }}">
            </div>
          </div>
          <div class="mt-3 mb-4">
            <label class="form-label">PAN Number</label>
            <input type="text" name="pan" class="form-control"
                   value="{{ client.pan if client else '' }}" placeholder="XXXXXXXXX">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-teal">
              <i class="bi bi-check-lg me-1"></i>{{ 'Update' if client else 'Save' }} Client
            </button>
            <a href="{{ url_for('clients.list_clients') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
